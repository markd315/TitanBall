server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:3306/titanball?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
app.jwtSecret=${JWT_SECRET:DevJWTSecretKey12345_DevJWTSecretKey12345}
app.jwtExpirationInMs=${JWT_EXPIRATION:604800000}
app.refreshExpirationInMs=${REFRESH_EXPIRATION:2592000000}