AWSTemplateFormatVersion: '2010-09-09'
Description: 'Pilot Light Server Stack for Titanball - ECS Fargate 2-Container Server with Autostart and 4-Hour Reaper'

Parameters:
  CloudFrontDistributionId:
    Type: String
    Default: E250EEB1SQKL1Z
    Description: The ID of your existing CloudFront distribution (e.g., E250EEB1SQKL1Z) for blockforger.net.

  ECRImageUri:
    Type: String
    Default: '720291373173.dkr.ecr.us-east-1.amazonaws.com/titanball:latest'
    Description: The ECR Docker Image URI for the Titanball game server.

  DatabaseRootPassword:
    Type: String
    NoEcho: true
    Default: 'devpassword'
    Description: Root password for the MySQL Database container.

  ExpirationHours:
    Type: String
    Default: '4'
    Description: Hours of inactivity before the server is automatically scaled down.

Resources:
  # ==========================================
  # NETWORKING RESOURCES
  # ==========================================
  GameVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: TitanballVPC

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref GameVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: TitanballPublicSubnet

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref GameVPC
      InternetGatewayId: !Ref InternetGateway

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref GameVPC
      Tags:
        - Key: Name
          Value: TitanballRouteTable

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  ServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable HTTP/WS access on ports 8080 and database access
      VpcId: !Ref GameVPC
      SecurityGroupIngress:
        # HTTP/WebSocket Game Server Port
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        # DB Port (Internal VPC access)
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 0.0.0.0/0

  # ==========================================
  # ECS FARGATE CONFIGURATION
  # ==========================================
  GameCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: TitanballCluster
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  EcsExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [ecs-tasks.amazonaws.com]
            Action: ['sts:AssumeRole']
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  EcsTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [ecs-tasks.amazonaws.com]
            Action: ['sts:AssumeRole']
      Policies:
        - PolicyName: ECSExecPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ssmmessages:CreateControlChannel'
                  - 'ssmmessages:CreateDataChannel'
                  - 'ssmmessages:OpenControlChannel'
                  - 'ssmmessages:OpenDataChannel'
                Resource: '*'

  GameLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/titanball-logs
      RetentionInDays: 7

  GameTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: TitanballTask
      Cpu: '4096'
      Memory: '8192'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !Ref EcsExecutionRole
      TaskRoleArn: !Ref EcsTaskRole
      ContainerDefinitions:
        - Name: game-server
          Image: !Ref ECRImageUri
          Cpu: 3584
          Memory: 6144
          PortMappings:
            - ContainerPort: 8080
              HostPort: 8080
          Environment:
            - Name: DB_HOST
              Value: '127.0.0.1'
            - Name: DB_USER
              Value: root
            - Name: DB_PASSWORD
              Value: !Ref DatabaseRootPassword
            - Name: DB_URL
              Value: !Sub "jdbc:mysql://127.0.0.1:3306/titanball?allowPublicKeyRetrieval=true&useSSL=false"
            - Name: JWT_SECRET
              Value: DevJWTSecretKey12345_DevJWTSecretKey12345
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref GameLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: server
          DependsOn:
            - ContainerName: db
              Condition: HEALTHY
        
        - Name: db
          Image: mysql:8.0
          Cpu: 512
          Memory: 2048
          PortMappings:
            - ContainerPort: 3306
              HostPort: 3306
          Environment:
            - Name: MYSQL_ROOT_PASSWORD
              Value: !Ref DatabaseRootPassword
            - Name: MYSQL_DATABASE
              Value: titanball
          Essential: true
          HealthCheck:
            Command: ["CMD-SHELL", "mysqladmin ping -h localhost -p$MYSQL_ROOT_PASSWORD"]
            Interval: 10
            Timeout: 5
            Retries: 5
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref GameLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: db

  GameService:
    Type: AWS::ECS::Service
    DependsOn: PublicRoute
    Properties:
      ServiceName: TitanballService
      Cluster: !Ref GameCluster
      TaskDefinition: !Ref GameTask
      EnableExecuteCommand: true
      LaunchType: FARGATE
      DesiredCount: 0
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref PublicSubnet
          SecurityGroups:
            - !Ref ServerSecurityGroup
          AssignPublicIp: ENABLED

  # ==========================================
  # WARMING / REAPING LAMBDA & PERMISSIONS
  # ==========================================
  PilotLightLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: ['sts:AssumeRole']
      Policies:
        - PolicyName: PilotLightServerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # ECS Operations
              - Effect: Allow
                Action:
                  - ecs:UpdateService
                  - ecs:DescribeServices
                  - ecs:TagResource
                  - ecs:ListTagsForResource
                  - ecs:ListTasks
                  - ecs:DescribeTasks
                  - ecs:CreateCluster
                  - ecs:CreateService
                  - ecs:ListTaskDefinitions
                Resource: '*'
              # ENI network interface resolution for Public IP
              - Effect: Allow
                Action:
                  - ec2:DescribeNetworkInterfaces
                Resource: '*'
              # Route 53 Operations (Automated subdomain records)
              - Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                  - route53:ListHostedZones
                  - route53:ListHostedZonesByName
                  - route53:ListResourceRecordSets
                Resource: '*'
              # IAM PassRole for ECS tasks
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: '*'
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              # CloudFront Configuration Custom Resource permissions
              - Effect: Allow
                Action:
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                Resource: '*'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  PilotLightLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: TitanballPilotLightHandler
      Runtime: python3.11
      Handler: index.handler
      Role: !GetAtt PilotLightLambdaRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          EXPIRATION_HOURS: !Ref ExpirationHours
          ECS_CLUSTER: !Ref GameCluster
          ECS_SERVICE: TitanballService
          ECS_TASK_FAMILY: TitanballTask
          ECS_SUBNET: !Ref PublicSubnet
          ECS_SECURITY_GROUP: !Ref ServerSecurityGroup
      Code:
        ZipFile: |
          import os,json,datetime,urllib.request,boto3,time
          from botocore.exceptions import ClientError
          ecs,ec2,cloudfront,route53=boto3.client('ecs'),boto3.client('ec2'),boto3.client('cloudfront'),boto3.client('route53')
          def handler(event,context):
           if "RequestType" in event:return handle_cfn_router(event,context)
           elif event.get("source")=="aws.events":return handle_reap(event,context)
           return handle_warm(event,context)
          def handle_warm(event,context):
           cluster=os.environ.get("ECS_CLUSTER","TitanballCluster").split('/')[-1]
           service=os.environ.get("ECS_SERVICE","TitanballService").split('/')[-1]
           hours=int(os.environ.get("EXPIRATION_HOURS","4"))
           exp=(datetime.datetime.now(datetime.timezone.utc)+datetime.timedelta(hours=hours)).isoformat()
           status,msg,public_ip="unknown","",None
           try:
            try:
             desc=ecs.describe_services(cluster=cluster,services=[service])
             active=[s for s in desc.get('services',[]) if s.get('status')=='ACTIVE']
            except ClientError as ce:
             if ce.response['Error']['Code'] in ['ClusterNotFoundException','ServiceNotFoundException','InvalidParameterException']:active=[]
             else:raise
            if not active:
             ecs.create_cluster(clusterName=cluster,settings=[{'name':'containerInsights','value':'enabled'}])
             family,subnet,sg=os.environ.get('ECS_TASK_FAMILY','TitanballTask'),os.environ.get('ECS_SUBNET'),os.environ.get('ECS_SECURITY_GROUP')
             task_arns=ecs.list_task_definitions(familyPrefix=family,status='ACTIVE',sort='DESC',maxResults=1).get('taskDefinitionArns',[])
             if not task_arns:task_arns=ecs.list_task_definitions(familyPrefix=family,sort='DESC',maxResults=1).get('taskDefinitionArns',[])
             if not task_arns:raise Exception(f"No task definition found for family {family}")
             try:
              ecs.create_service(cluster=cluster,serviceName=service,taskDefinition=task_arns[0],desiredCount=1,launchType='FARGATE',enableExecuteCommand=True,networkConfiguration={'awsvpcConfiguration':{'subnets':[subnet],'securityGroups':[sg],'assignPublicIp':'ENABLED'}})
             except ClientError as e:
              if 'already exists' not in str(e).lower() and 'not idempotent' not in str(e).lower():raise
             desc=ecs.describe_services(cluster=cluster,services=[service])
             active=[s for s in desc.get('services',[]) if s.get('status')=='ACTIVE']
            if not active:
             status,msg="starting","ECS service creation in progress"
            else:
             svc=active[0]
             if svc.get('desiredCount',0)!=1:
              ecs.update_service(cluster=cluster,service=service,desiredCount=1)
              status,msg="starting","ECS service scaling to 1 initiated"
             else:
              status,msg="running","ECS service is running"
             try:ecs.tag_resource(resourceArn=svc['serviceArn'],tags=[{'key':'ExpirationTime','value':exp}])
             except Exception:pass
             for _ in range(15):
              tasks=ecs.list_tasks(cluster=cluster,serviceName=service,desiredStatus='RUNNING').get('taskArns',[])
              if tasks:
               tdesc=ecs.describe_tasks(cluster=cluster,tasks=[tasks[0]]).get('tasks',[{}])[0]
               eni_id=None
               for att in tdesc.get('attachments',[]):
                if att.get('type') in ['ElasticNetworkInterface','eni']:
                 for d in att.get('details',[]):
                  if d.get('name')=='networkInterfaceId':eni_id=d.get('value');break
               if eni_id:
                nis=ec2.describe_network_interfaces(NetworkInterfaceIds=[eni_id]).get('NetworkInterfaces',[])
                if nis:
                 public_ip=nis[0].get('Association',{}).get('PublicIp')
                 if public_ip:break
              time.sleep(1.5)
            if public_ip:
             status,msg="running","ECS service running and DNS mapped"
             zones=route53.list_hosted_zones_by_name(DNSName='blockforger.net.')['HostedZones']
             if zones:
              tzone=next((z for z in zones if z['Name'].rstrip('.')=='blockforger.net'),zones[0])
              route53.change_resource_record_sets(
               HostedZoneId=tzone['Id'].split('/')[-1],
               ChangeBatch={'Changes':[{'Action':'UPSERT','ResourceRecordSet':{'Name':'titanball-server.blockforger.net.','Type':'A','TTL':10,'ResourceRecords':[{'Value':public_ip}]}}]}
              )
           except Exception as e:
            return {"statusCode":200,"headers":{"Access-Control-Allow-Origin":"*"},"body":json.dumps({"status":"error","error":str(e)})}
           res={"status":status,"message":msg,"expirationTime":exp}
           if public_ip:res["serverUrl"],res["wsUrl"],res["publicIp"]="https://blockforger.net","wss://blockforger.net",public_ip
           return {"statusCode":200,"headers":{"Access-Control-Allow-Origin":"*"},"body":json.dumps(res)}
          def handle_reap(event,context):
           cluster=os.environ.get("ECS_CLUSTER","TitanballCluster").split('/')[-1]
           service=os.environ.get("ECS_SERVICE","TitanballService").split('/')[-1]
           now=datetime.datetime.now(datetime.timezone.utc)
           try:
            try:
             desc=ecs.describe_services(cluster=cluster,services=[service],include=['TAGS'])
             svcs=desc.get('services',[])
             if svcs and svcs[0].get('desiredCount',0)>0:
              tag=next((t for t in svcs[0].get('tags',[]) if t.get('key')=='ExpirationTime'),None)
              if tag and now>datetime.datetime.fromisoformat(tag['value']):
               ecs.update_service(cluster=cluster,service=service,desiredCount=0)
            except ClientError as ce:
             if ce.response['Error']['Code'] not in ['ClusterNotFoundException','ServiceNotFoundException']:raise
           except Exception as e:print("Reap err:",e)
          def handle_cfn_router(event,context):
           req_type,props=event.get("RequestType"),event.get("ResourceProperties",{})
           dist_id,warm_url=props.get("CloudFrontDistributionId"),props.get("WarmLambdaUrl")
           phys_id=event.get("PhysicalResourceId") or "TitanballCloudFrontRouter"
           if not dist_id or not warm_url:return send_cfn(event,context,"FAILED",{"Message":"Missing params"},phys_id)
           domain=warm_url.replace("https://","").replace("/","")
           l_id,s_id="PilotLightLambdaUrlOrigin","TitanballGameServerOrigin"
           try:
            res=cloudfront.get_distribution_config(Id=dist_id)
            config,etag=res['DistributionConfig'],res['ETag']
            updated=False
            if req_type in ["Create","Update"]:
             origins=config.get('Origins',{})
             items=origins.get('Items',[])
             o_lambda={'Id':l_id,'DomainName':domain,'OriginPath':'','CustomHeaders':{'Quantity':0,'Items':[]},'CustomOriginConfig':{'HTTPPort':80,'HTTPSPort':443,'OriginProtocolPolicy':'https-only','OriginSslProtocols':{'Quantity':1,'Items':['TLSv1.2']},'OriginReadTimeout':30,'OriginKeepaliveTimeout':5},'ConnectionAttempts':3,'ConnectionTimeout':10,'OriginShield':{'Enabled':False}}
             o_server={'Id':s_id,'DomainName':'titanball-server.blockforger.net','OriginPath':'','CustomHeaders':{'Quantity':0,'Items':[]},'CustomOriginConfig':{'HTTPPort':8080,'HTTPSPort':443,'OriginProtocolPolicy':'http-only','OriginSslProtocols':{'Quantity':1,'Items':['TLSv1.2']},'OriginReadTimeout':30,'OriginKeepaliveTimeout':5},'ConnectionAttempts':3,'ConnectionTimeout':10,'OriginShield':{'Enabled':False}}
             for new_o in [o_lambda,o_server]:
              idx=next((i for i,o in enumerate(items) if o['Id']==new_o['Id']),-1)
              if idx>=0:
               if items[idx]['DomainName']!=new_o['DomainName']:items[idx],updated=new_o,True
              else:items.append(new_o);updated=True
             origins['Items'],origins['Quantity']=items,len(items)
             config['Origins']=origins
             behaviors=config.get('CacheBehaviors',{})
             b_items=behaviors.get('Items',[])
             default_b=config.get('DefaultCacheBehavior',{})
             has_cp='CachePolicyId' in default_b
             def make_b(path,tid):
              b={'PathPattern':path,'TargetOriginId':tid,'ViewerProtocolPolicy':'redirect-to-https','AllowedMethods':{'Quantity':7,'Items':['GET','HEAD','POST','PUT','PATCH','OPTIONS','DELETE'],'CachedMethods':{'Quantity':2,'Items':['GET','HEAD']}},'SmoothStreaming':False,'Compress':True,'LambdaFunctionAssociations':{'Quantity':0,'Items':[]},'FieldLevelEncryptionId':''}
              if has_cp:
               b['CachePolicyId']='4135ea2d-6df8-44a3-9df3-4b5a84be39ad'
               b['OriginRequestPolicyId']='b689b0a8-53d0-40dd-86a5-5ec57a859476'
              else:
               b['ForwardedValues']={'QueryString':True,'Cookies':{'Forward':'all'},'Headers':{'Quantity':8,'Items':['Authorization','Origin','Access-Control-Request-Headers','Access-Control-Request-Method','Content-Type','Accept','Referer','User-Agent']},'QueryStringCacheKeys':{'Quantity':0}}
               b['MinTTL']=0;b['DefaultTTL']=0;b['MaxTTL']=0
              return b
             b_items=[b for b in b_items if b['PathPattern'] not in ['/pages/titanball/api/warm','/pages/titanball/api/*','/pages/titanball/game']]
             b_items.insert(0,make_b('/pages/titanball/game',s_id))
             b_items.insert(0,make_b('/pages/titanball/api/*',s_id))
             b_items.insert(0,make_b('/pages/titanball/api/warm',l_id))
             behaviors['Items'],behaviors['Quantity']=b_items,len(b_items)
             config['CacheBehaviors']=behaviors
             updated=True
            elif req_type=="Delete":
             behaviors=config.get('CacheBehaviors',{})
             b_items=behaviors.get('Items',[])
             orig_len=len(b_items)
             b_items=[b for b in b_items if b['PathPattern'] not in ['/pages/titanball/api/warm','/pages/titanball/api/*','/pages/titanball/game']]
             if len(b_items)!=orig_len:updated=True
             behaviors['Items'],behaviors['Quantity']=b_items,len(b_items)
             config['CacheBehaviors']=behaviors
             origins=config.get('Origins',{})
             items=origins.get('Items',[])
             orig_len_o=len(items)
             items=[o for o in items if o['Id'] not in [l_id,s_id]]
             if len(items)!=orig_len_o:updated=True
             origins['Items'],origins['Quantity']=items,len(items)
             config['Origins']=origins
             try:
              zones=route53.list_hosted_zones_by_name(DNSName='blockforger.net.')['HostedZones']
              if zones:
               zid=zones[0]['Id'].split('/')[-1]
               rsets=route53.list_resource_record_sets(HostedZoneId=zid,StartRecordName='titanball-server.blockforger.net.',StartRecordType='A',MaxItems=1)
               for rset in rsets.get('ResourceRecordSets',[]):
                if rset['Name']=='titanball-server.blockforger.net.':
                 route53.change_resource_record_sets(HostedZoneId=zid,ChangeBatch={'Changes':[{'Action':'DELETE','ResourceRecordSet':rset}]})
             except Exception as de:print("Route53 clean err:",de)
            if updated:cloudfront.update_distribution(Id=dist_id,DistributionConfig=config,IfMatch=etag)
            send_cfn(event,context,"SUCCESS",{"Message":"Done"},phys_id)
           except Exception as e:
            print("Router err:",e)
            send_cfn(event,context,"FAILED",{"Message":str(e)},phys_id,reason=f"Err: {str(e)[:180]}")
          def send_cfn(event,context,status,data,phys_id,reason=None):
           body=json.dumps({"Status":status,"Reason":reason or f"Logs: {getattr(context,'log_stream_name','none')}","PhysicalResourceId":phys_id,"StackId":event.get("StackId"),"RequestId":event.get("RequestId"),"LogicalResourceId":event.get("LogicalResourceId"),"Data":data}).encode('utf-8')
           req=urllib.request.Request(event["ResponseURL"],data=body,headers={"content-type":"","content-length":str(len(body))},method="PUT")
           try:
            with urllib.request.urlopen(req) as f:pass
           except Exception as e:print("CFN send fail:",e)

  PilotLightLambdaUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref PilotLightLambda
      AuthType: NONE
      Cors:
        AllowOrigins: ['*']
        AllowMethods: ['*']
        AllowHeaders: ['*']
        MaxAge: 86400

  PilotLightLambdaUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PilotLightLambda
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  # ==========================================
  # REAPER SCHEDULER (EVENTBRIDGE)
  # ==========================================
  ReaperScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Triggers the Reaper Lambda scan every 10 minutes
      ScheduleExpression: rate(10 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt PilotLightLambda.Arn
          Id: ReaperTrigger

  ReaperPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PilotLightLambda
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ReaperScheduleRule.Arn

  # ==========================================
  # CLOUDFRONT ROUTING CUSTOM RESOURCE
  # ==========================================
  CloudFrontRouter:
    Type: Custom::CloudFrontRouter
    DependsOn: PilotLightLambdaUrlPermission
    Properties:
      ServiceToken: !GetAtt PilotLightLambda.Arn
      CloudFrontDistributionId: !Ref CloudFrontDistributionId
      WarmLambdaUrl: !GetAtt PilotLightLambdaUrl.FunctionUrl

Outputs:
  LambdaFunctionUrl:
    Description: URL to manually test server warming
    Value: !GetAtt PilotLightLambdaUrl.FunctionUrl
