version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: devpassword
      MYSQL_DATABASE: titanball
    ports:
      - "3306:3306"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pdevpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: .
    ports:
      - "3030:8080"
    environment:
      DB_URL: jdbc:mysql://db:3306/titanball?allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: root
      DB_PASSWORD: devpassword
      JWT_SECRET: DevJWTSecretKey12345
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
